# Small ELK lab for the Week 5 hunt (Elasticsearch + Kibana, no security, lab only!)
# Start:  docker compose up -d      (needs ~4 GB free RAM, first start takes 1-2 minutes)
# Kibana: http://localhost:5601
# Stop:   docker compose down       (add -v to also delete the data)
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      - elasticsearch

volumes:
  esdata:
