title: LSASS Memory Dump with comsvcs.dll MiniDump (Black Basta H3)
id: 4e1d7b3a-9c2f-4a8e-b6d1-3f0a5c7e9b03
status: experimental
description: >
  Week 5 hunt H3. rundll32 calls MiniDump in comsvcs.dll to dump LSASS memory and steal passwords.
  Black Basta operators dump LSASS credentials (Mimikatz) before moving across the network.
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: Botakoz Berikkyzy, Alina Ashirova, Timur Aktayev
date: 2026-10-07
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\rundll32.exe'
    CommandLine|contains|all:
      - 'comsvcs'
      - 'minidump'
  condition: selection
falsepositives:
  - Very unlikely
level: critical
