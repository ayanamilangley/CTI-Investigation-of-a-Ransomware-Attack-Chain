title: Built-in Windows Tool Downloads a File from the Internet (Black Basta H2)
id: 7c3e2a90-1f4b-4c6d-8e2a-9b5d0f4e6a02
status: experimental
description: >
  Week 5 hunt H2. curl, bitsadmin, certutil or the PowerShell web client download a file.
  Storm-1811 used curl after a Quick Assist session; Black Basta uses BITSAdmin.
references:
  - https://www.microsoft.com/en-us/security/blog/2024/05/15/threat-actors-misusing-quick-assist-in-social-engineering-attacks-leading-to-ransomware/
  - https://attack.mitre.org/techniques/T1105/
author: Botakoz Berikkyzy, Alina Ashirova, Timur Aktayev
date: 2026-10-07
tags:
  - attack.command-and-control
  - attack.t1105
  - attack.t1197
logsource:
  category: process_creation
  product: windows
detection:
  selection_tool:
    Image|endswith:
      - '\curl.exe'
      - '\bitsadmin.exe'
      - '\certutil.exe'
    CommandLine|contains:
      - 'http://'
      - 'https://'
  selection_ps:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - 'DownloadString'
      - 'DownloadFile'
      - 'Net.WebClient'
      - 'Invoke-WebRequest'
      - 'Start-BitsTransfer'
  condition: selection_tool or selection_ps
falsepositives:
  - Admins and update scripts. Very common for curl; correlate with Quick Assist or remote tools on the same host.
level: medium
