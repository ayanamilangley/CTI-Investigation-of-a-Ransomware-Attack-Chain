title: Shadow Copy Created or Deleted with vssadmin or wmic (Black Basta H3)
id: 9a5f0c2d-3b7e-4d1f-a8c6-2e4b6d8f0a04
status: experimental
description: >
  Week 5 hunt H3 (updated Week 1 hypothesis). Black Basta deletes shadow copies before encryption (T1490).
  Creating a shadow copy on a domain controller is used to steal NTDS.dit (T1003.003).
references:
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa24-131a
  - https://attack.mitre.org/techniques/T1490/
author: Botakoz Berikkyzy, Alina Ashirova, Timur Aktayev
date: 2026-10-07
tags:
  - attack.impact
  - attack.t1490
  - attack.credential-access
  - attack.t1003.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_vssadmin:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains: 'shadow'
  selection_wmic:
    Image|endswith: '\wmic.exe'
    CommandLine|contains|all:
      - 'shadowcopy'
      - 'delete'
  condition: selection_vssadmin or selection_wmic
falsepositives:
  - Backup software can create shadow copies. Delete on a server or workstation is almost never normal.
level: high
